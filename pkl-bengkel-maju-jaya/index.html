<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PKL Bengkel Maju Jaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f141a;--surface:#171f28;--surface2:#202a35;--line:#2d3946;--ink:#e6ebf0;--ink2:#c3ccd5;--muted:#8e9cab;--accent:#f3b52f;--ok:#3fcf7d;--danger:#ff4d4d;--blue:#1f8bff;
 --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--body:'Barlow','Segoe UI',Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--game:'Fredoka','Barlow',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;height:100dvh}
/* ===== uniform header ===== */
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.bar img{width:42px;height:42px;flex:none}
.bar .ttl{flex:1;min-width:0}
.eyebrow{font:600 12px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{margin:2px 0 0;font:700 23px/1.1 var(--display);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.dims{font:500 12px var(--mono);color:var(--ink2);white-space:nowrap;border:1px solid var(--line);border-radius:4px;padding:3px 7px}
.guru{font:500 12px var(--body);color:var(--muted);white-space:nowrap}
.guru b{color:var(--ink2);font-weight:600}
.credit{font:500 11px var(--body);color:var(--muted);text-align:center;padding:5px 16px;background:var(--surface);border-top:1px solid var(--line)}
@media (max-width:640px){.bar{padding:8px 10px;gap:8px}.bar img{width:34px;height:34px}h1{font-size:19px}.eyebrow{font-size:10.5px}.guru{font-size:10.5px;white-space:normal;max-width:150px}.dims{font-size:10.5px;padding:2px 5px}.credit{font-size:10px}}
/* ===== game view ===== */
.view{position:relative;overflow:hidden;background:#87b9e6;min-height:0}
#c{display:block;width:100%;height:100%;touch-action:none;outline:none}
.hud{position:absolute;inset:0;pointer-events:none;font-family:var(--game)}
.hud>*{pointer-events:auto}
.pnl{background:rgba(17,21,27,.78);border:2px solid rgba(255,255,255,.08);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
#quest{position:absolute;left:10px;top:10px;max-width:min(300px,62vw);padding:10px 12px}
#quest .qh{font:700 13px var(--game);color:var(--accent);letter-spacing:.04em;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
#quest ol{list-style:none;margin:6px 0 0;padding:0;font:500 13.5px/1.3 var(--game)}
#quest li{display:flex;gap:7px;padding:3px 0;color:#9aa6b2}
#quest li .b{flex:none;width:17px;height:17px;border-radius:5px;border:2px solid #4a5662;display:grid;place-items:center;font-size:11px;margin-top:1px}
#quest li.done{color:#6fdc9c;text-decoration:line-through;text-decoration-color:rgba(111,220,156,.5)}
#quest li.done .b{background:#2fbf6f;border-color:#2fbf6f;color:#0f141a}
#quest li.now{color:#fff;font-weight:600}
#quest li.now .b{border-color:var(--accent);animation:pulse 1.2s infinite}
#quest .dist{font:600 12px var(--game);color:var(--accent);margin-top:4px}
#quest.min ol,#quest.min .dist{display:none}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(243,181,47,.25)}}
#topR{position:absolute;right:10px;top:10px;display:flex;gap:8px;align-items:center}
.coin{font:700 17px var(--game);padding:7px 12px 7px 9px;display:flex;align-items:center;gap:6px;color:#ffe08a}
.coin i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#f3b52f 55%,#b77a0e);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);display:grid;place-items:center;font-style:normal;font-size:12px;color:#7a4c00}
.ibtn{width:42px;height:42px;display:grid;place-items:center;font-size:19px;border:0}
#prompt{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:none;align-items:center;gap:9px;padding:7px 12px 7px 7px;cursor:pointer;white-space:nowrap}
#prompt .k{width:34px;height:34px;border-radius:9px;background:#fff;color:#111;font:700 17px var(--game);display:grid;place-items:center;box-shadow:inset 0 -3px 0 #c9ced4}
#prompt .t small{display:block;font:500 11.5px var(--game);color:#aab4be}
#prompt .t b{font:700 15px var(--game)}
#prompt:active{transform:translate(-50%,-100%) scale(.95)}
#joy{position:absolute;left:18px;bottom:18px;width:124px;height:124px;border-radius:50%;background:rgba(17,21,27,.35);border:2px solid rgba(255,255,255,.25);display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 3px 10px rgba(0,0,0,.3)}
#jump{position:absolute;right:20px;bottom:24px;width:70px;height:70px;border-radius:50%;display:none;font-size:26px;border:2px solid rgba(255,255,255,.3)}
.touch #joy,.touch #jump{display:block}
#toasts{position:absolute;left:50%;top:62px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:5}
.tst{font:600 14.5px var(--game);padding:8px 14px;animation:tin .3s ease,tout .4s ease 2.4s forwards;text-align:center;max-width:86vw}
.tst.ok{border-color:rgba(63,207,125,.6)}.tst.bad{border-color:rgba(255,77,77,.6)}.tst.gold{border-color:rgba(243,181,47,.7);color:#ffe08a}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
/* dialog */
#dlg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(640px,calc(100% - 20px));padding:12px 14px 14px;display:none;z-index:6}
#dlg .who{display:inline-block;font:700 13px var(--game);background:var(--accent);color:#1a1300;border-radius:8px;padding:3px 10px;margin-bottom:6px}
#dlg .txt{font:500 16px/1.45 var(--game);min-height:46px}
#dlg .ch{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.gbtn{font:700 15px var(--game);border:0;border-radius:11px;padding:10px 16px;background:var(--blue);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);transition:transform .1s}
.gbtn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.gbtn.y{background:var(--accent);color:#1a1300}.gbtn.g{background:#22b866}.gbtn.r{background:#e04848}.gbtn.gr{background:#3a4652}
.gbtn[disabled]{opacity:.45;cursor:default}
/* modal */
#modal{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(5,8,11,.55)}
#modal.show{display:flex}
#mbox{width:min(720px,100%);max-height:100%;overflow:auto;padding:16px;font-family:var(--game);animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
#mbox h2{margin:0 0 4px;font:700 22px var(--game)}
#mbox .kick{font:700 12px var(--game);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
#mbox p{font:500 15px/1.5 var(--game);color:#d5dde4;margin:8px 0}
#mbox .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fb{border-radius:11px;padding:9px 12px;margin:8px 0;font:500 14.5px/1.45 var(--game)}
.fb.ok{background:rgba(34,184,102,.16);border:1.5px solid rgba(34,184,102,.55)}
.fb.bad{background:rgba(224,72,72,.15);border:1.5px solid rgba(224,72,72,.55)}
.fb.info{background:rgba(31,139,255,.13);border:1.5px solid rgba(31,139,255,.45)}
.know{border-radius:11px;padding:9px 12px;margin:8px 0;font:500 14px/1.45 var(--game);background:rgba(243,181,47,.12);border:1.5px solid rgba(243,181,47,.45)}
.know b{color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.ocard{background:#232d38;border:2px solid #34414e;border-radius:12px;padding:10px;text-align:left;font:600 14px/1.3 var(--game);min-height:64px;display:flex;gap:8px;align-items:flex-start}
.ocard .ic{font-size:22px;flex:none}
.ocard small{display:block;font:500 12px/1.35 var(--game);color:#9fb0bf;margin-top:2px}
.ocard.used{opacity:.3;pointer-events:none}
.ocard.bad{border-color:#e04848;animation:shake .35s}
.ocard.ok{border-color:#22b866}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.slots{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.slot{display:flex;align-items:center;gap:10px;background:#1a222b;border:2px dashed #3a4652;border-radius:11px;padding:8px 10px;min-height:44px;font:600 14px var(--game)}
.slot .n{width:26px;height:26px;border-radius:8px;background:#2d3946;display:grid;place-items:center;font-size:13px;flex:none}
.slot.fill{border-style:solid;border-color:#4b5a69;background:#232d38}
.slot.ok{border-color:#22b866}.slot.bad{border-color:#e04848}
table.sup{width:100%;border-collapse:separate;border-spacing:0 6px;font:500 13.5px var(--game)}
.supc{background:#232d38;border:2px solid #34414e;border-radius:12px;padding:9px 10px;text-align:left;width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.supc b{font:700 14.5px var(--game)}
.supc .pr{font:700 15px var(--game);color:#ffe08a;text-align:right}
.supc small{color:#9fb0bf;font:500 12.5px var(--game)}
.supc .st{color:#ffc94a;letter-spacing:1px}
.supc.sel{border-color:var(--accent);background:#2e2a17}
.mat{margin:10px 0 4px;font:700 14px var(--game);color:#cfe3ff;display:flex;justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (max-width:560px){.grid3{grid-template-columns:1fr}}
.qcw{display:grid;grid-template-columns:230px 1fr;gap:12px;align-items:start}
@media (max-width:560px){.qcw{grid-template-columns:1fr}}
.qcw canvas{width:100%;border-radius:12px;background:#0c1116;border:2px solid #34414e}
.read{width:100%;border-collapse:collapse;font:500 14px var(--game)}
.read td{padding:6px 4px;border-bottom:1px solid #2d3946}
.read td:last-child{text-align:right;font:700 15px var(--mono)}
.spec{font:500 12.5px/1.5 var(--game);color:#9fb0bf;background:#1a222b;border-radius:10px;padding:7px 10px;margin-top:8px}
.fin{width:100%;border-collapse:collapse;font:500 14.5px var(--game);margin:6px 0}
.fin td{padding:6px 4px;border-bottom:1px solid #2d3946}.fin td:last-child{text-align:right;font-family:var(--mono)}
.fin tr.tot td{font-weight:700;font-size:16px;border-top:2px solid #4b5a69;border-bottom:0}
.neg{color:#ff8a8a}.pos{color:#7ee2a5}
.stars{font-size:40px;letter-spacing:6px;text-align:center}
.tpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.tpc{background:#232d38;border:2px solid #34414e;border-radius:13px;padding:11px;text-align:left;font:600 14.5px/1.3 var(--game);display:flex;flex-direction:column;gap:3px;min-height:110px}
.tpc .no{font:700 11.5px var(--game);color:var(--accent);letter-spacing:.06em}
.tpc small{font:500 12.5px var(--game);color:#9fb0bf}
.tpc.lock{opacity:.5}
.tpc .s{margin-top:auto;font-size:14px}
input.nm{width:100%;font:600 16px var(--game);padding:11px 12px;border-radius:11px;border:2px solid #3a4652;background:#0f141a;color:#fff;margin-top:6px}
input.nm:focus{outline:none;border-color:var(--accent)}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 13px var(--game);color:#b9c5d0;margin-top:6px}
.keys kbd{font:700 12px var(--game);background:#fff;color:#111;border-radius:6px;padding:1px 7px;box-shadow:inset 0 -2px 0 #c9ced4}
@media (max-width:640px){#quest{max-width:calc(100% - 214px);padding:8px 10px}#quest li:not(.now){display:none}#quest ol{font-size:13px}.coin{font-size:15px;padding:6px 9px 6px 7px}.ibtn{width:38px;height:38px;font-size:17px}#topR{gap:6px}h1{font-size:17px}}
.schr{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#232d38;border:2px solid #34414e;border-radius:12px;padding:8px 10px;margin:6px 0;font:600 14px/1.3 var(--game)}
.schr small{display:block;font:500 12.5px var(--game);color:#ffd98a;margin-top:2px}
.schr.ok{border-color:#22b866}.schr.bad{border-color:#e04848}
.seg{display:flex;gap:4px;flex:none}
.seg button{font:600 12.5px var(--game);border:0;border-radius:8px;padding:8px 9px;background:#34414e;color:#cfd8e0}
.seg button.on{background:var(--accent);color:#1a1300}
@media (max-width:560px){.schr{flex-direction:column;align-items:stretch}.seg button{flex:1}}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.week div{background:#232d38;border:2px solid #34414e;border-radius:10px;padding:8px 4px;text-align:center;font:500 11.5px/1.3 var(--game);min-height:66px}
.week div b{display:block;font:700 13px var(--game);margin-bottom:3px}
.week div.now{border-color:var(--accent)}.week div.ok{background:rgba(34,184,102,.2);border-color:#22b866}.week div.pm{background:rgba(31,139,255,.2);border-color:#1f8bff}.week div.dn{background:rgba(224,72,72,.22);border-color:#e04848}
.tbl th{white-space:nowrap}
.nb{background-color:#fbf6e6;background-image:repeating-linear-gradient(transparent 0 27px,#c9dbea 27px 28px);color:#22303c;border-radius:10px;border-left:6px solid #e04848;padding:6px 14px 10px 18px;font:500 14.5px/28px var(--game);margin:8px 0}
.nb h3{margin:0;font:700 15.5px/28px var(--game);color:#1d3557}.nb b{color:#12325e}.nb .bg{background:#fff3a8;border-radius:5px;padding:0 6px;font-weight:600}.nb .dt{color:#5b6b7a;font-size:13.5px}
#meters{position:absolute;right:10px;top:62px;width:178px;padding:7px 10px;display:none}
.mt{font:600 12px var(--game);margin:3px 0}.mt i{display:block;height:7px;border-radius:5px;background:#2d3946;overflow:hidden;margin-top:2px}.mt i b{display:block;height:100%;border-radius:5px;transition:width .5s}
.jcard{background:linear-gradient(135deg,#243447,#1a2430);border:2px solid var(--accent);border-radius:14px;padding:10px 12px;margin:8px 0}
.jcard .jh{font:700 11.5px var(--game);letter-spacing:.08em;color:var(--accent)}.jcard h3{margin:2px 0 4px;font:700 19px var(--game)}.jcard small{color:#9fb0bf}
.ladder{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font:700 13px var(--game);margin:10px 0;color:#9fb0bf}.ladder span{background:#1f8bff;color:#fff;border-radius:8px;padding:6px 10px}
@media (max-width:640px){#meters{top:56px;width:150px}}
.signopts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.signopts button{background:#fff;border:4px solid #34414e;border-radius:12px;padding:6px;aspect-ratio:1}
.signopts button img{width:100%;height:100%;object-fit:contain;display:block}
.signopts button.ok{border-color:#22b866}.signopts button.bad{border-color:#e04848;opacity:.55}
#loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#0f141a;font:700 20px var(--game);color:var(--accent);transition:opacity .5s}
#loading.hide{opacity:0;pointer-events:none}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
#confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.tbl{width:100%;border-collapse:collapse;font:500 13.5px var(--game);margin:8px 0}
.tbl th,.tbl td{border-bottom:1px solid #2d3946;padding:6px 4px;text-align:left;vertical-align:top}
.tbl th{color:var(--accent);font-size:12.5px}

/* ===== jendela kerja stasiun (PKL) ===== */
:root{--warn:#ffc94a;--bad:#ff8a8a;--good:#7ee2a5;--f-mono:var(--mono);--f-body:var(--body);--steel:#9cc9ff;--bp-ink:#a6cdec;--bp-grid:#1a3043}
#mbox .work{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.hd h3{margin:0;font:700 19px var(--game)}
.chip{font:600 12px var(--game);padding:2px 9px;border-radius:999px;border:1.5px solid #4b5a69;color:#cfd8e0;white-space:nowrap}
.chip.k{border-color:var(--blue);color:#9cc9ff}.chip.ok{border-color:#22b866;color:#7ee2a5}.chip.bad{border-color:#e04848;color:#ff8a8a}
#mbox p.label,.label{font:700 12px var(--game);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.tog{font:600 14.5px var(--game);border:2px solid #34414e;background:#232d38;color:#e6ebf0;border-radius:11px;padding:9px 13px}
.tog[aria-pressed="true"]{background:var(--accent);color:#1a1300;border-color:var(--accent)}
.btn{font:700 15px var(--game);border:0;border-radius:11px;padding:10px 16px;background:#3a4652;color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--accent);color:#1a1300}.btn.steel{background:var(--blue)}.btn.danger{background:#e04848}
.btn.sm{padding:6px 11px;font-size:13px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}.btn.big{padding:13px 20px;font-size:17px}
.btn:disabled{opacity:.45}
.num{font-family:var(--mono)}.small{font-size:13px}.muted{color:#9fb0bf}
#mbox p.small{font-size:13px}#mbox p.muted{color:#9fb0bf}
.mentor .hb{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.msg{border-radius:11px;padding:9px 12px;font:500 14.5px/1.45 var(--game)}
#mbox p.msg.info{background:rgba(31,139,255,.13);border:1.5px solid rgba(31,139,255,.45)}
.meter{height:14px;background:#2d3946;border-radius:7px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
.slider{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.slider input{width:100%;accent-color:var(--accent)}.slider .num{font-size:19px;min-width:8ch;text-align:right}
.qa{display:grid;grid-template-columns:1fr 110px;gap:8px 10px;align-items:center;font:500 14.5px var(--game)}
.qa input,#rd{font:600 15px var(--mono);padding:8px;border-radius:9px;border:2px solid #3a4652;background:#0f141a;color:#fff;width:100%}
#rd{width:120px}.qa .wrong{border-color:#e04848}.qa .right{border-color:#22b866}
.hold{user-select:none;-webkit-user-select:none;touch-action:none}
.bp-wrap{background:#10212f;border:2px solid #1a3043;border-radius:12px;overflow-x:auto}.bp-wrap svg{display:block;width:100%;min-width:440px;height:auto}
.bp-line{stroke:var(--bp-ink);stroke-width:2.4;fill:none}.bp-thin{stroke:var(--bp-ink);stroke-width:.9;fill:none}
.bp-ctr{stroke:var(--bp-ink);stroke-width:.8;fill:none;stroke-dasharray:14 3 2 3;opacity:.8}.bp-fill{fill:var(--bp-ink)}
.bp-txt{fill:var(--bp-ink);font-family:var(--mono);font-size:12px}.bp-ttl{fill:var(--bp-ink);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em}
.bp-gridl{stroke:var(--bp-grid);stroke-width:1;fill:none}
.cal-wrap{overflow-x:auto;border:2px solid #34414e;border-radius:12px;background:#eef1f3}.cal-wrap svg{display:block}
.c-beam{fill:#d5d9dd;stroke:#1c2420;stroke-width:1}.c-slide{fill:#bcd3e6;stroke:#285a7d;stroke-width:1}
.c-tick{stroke:#1c2420;stroke-width:1}.c-vtick{stroke:#1d4b70;stroke-width:1}
.c-txt{fill:#1c2420;font-family:var(--mono);font-size:12px}.c-vtxt{fill:#1d4b70;font-family:var(--mono);font-size:11px}
.c-hl{fill:none;stroke:#d9480f;stroke-width:3}.c-hlt{fill:#b93a08;font-family:var(--mono);font-size:12px;font-weight:600}
.skills{display:flex;flex-direction:column;gap:9px;margin:10px 0;font:500 14.5px var(--game)}
.sk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}.sk .bar{grid-column:1/3;height:9px;background:#2d3946;border-radius:5px;overflow:hidden}.sk .bar i{display:block;height:100%;background:var(--blue)}
.bignum{display:flex;gap:10px;align-items:baseline;margin-top:8px}.bignum .num{font-size:46px;line-height:1;font-weight:500}
.cert img{display:block;width:100%;height:auto;border-radius:8px;margin:8px 0}
.jr{display:flex;flex-direction:column;gap:6px;font:500 14px/1.4 var(--game);margin:8px 0}.jr div{display:grid;grid-template-columns:64px 1fr;gap:8px;border-bottom:1px dashed #34414e;padding-bottom:5px}
#mbox textarea{width:100%;min-height:170px;font:500 12.5px/1.45 var(--mono);color:#e6ebf0;background:#0f141a;border:2px solid #34414e;border-radius:10px;padding:8px}
.panel{margin:12px 0}.panel h2{font-size:18px!important}
.ref table{width:100%;border-collapse:collapse;font:500 13.5px var(--game)}.ref td,.ref th{border-bottom:1px solid #2d3946;padding:6px 4px;text-align:left}.ref th{color:var(--accent);font-size:12.5px}
.tbl-x,.tbl{overflow-x:auto}
#mbox ol.small{font:500 14px/1.5 var(--game);color:#d5dde4}
.schr>span:first-child{min-width:0}
</style>
