<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jobsheet Virtual SKEH — Ujian Praktik ASAS Ganjil XII TOI (IFP)</title>
<meta name="description" content="Jobsheet virtual JS-ASAS-SKEH-XII untuk Interaktif Flat Panel: K3, rangkai pneumatik, rangkai kontrol relai, uji fungsi, pengamatan, lisan, dan rekap nilai.">
<meta name="theme-color" content="#0b5cad">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="../favicon-48.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07111c;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif}
input{-webkit-user-select:text;user-select:text}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:#0E1C2E;color:#eef3f8;overflow:hidden}
#top{height:76px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0b2440;border-bottom:3px solid #f3b52f}
.brand{line-height:1.15;white-space:nowrap}.brand b{font-size:20px;display:block}.brand span{font-size:14px;color:#9fb2c6}
#steps{display:flex;gap:6px;flex:1;justify-content:center}
.st{padding:8px 12px;border-radius:999px;background:#16304e;color:#8ea4ba;font-size:16px;font-weight:700;white-space:nowrap}
.st.cur{background:#f3b52f;color:#1a1300}.st.done{background:#1d6f47;color:#dff7ea}
#clock{text-align:right;line-height:1.2;white-space:nowrap}#clock b{font:700 22px ui-monospace,Consolas,monospace;display:block}#clock span{font:600 15px ui-monospace,Consolas,monospace;color:#9fb2c6}#clock span.late{color:#ff8a65}
.mode{white-space:nowrap;font-size:13px;font-weight:800;padding:5px 9px;border-radius:8px;background:#c62828;color:#fff;letter-spacing:.04em}.mode.lat{background:#1565c0}
.ib{width:56px;height:56px;border-radius:14px;border:0;background:#16304e;color:#fff;font-size:26px}.ib.on{background:#f3b52f;color:#1a1300}
#main{position:absolute;top:76px;left:0;right:0;bottom:0;padding:16px 20px}
.row{display:flex;gap:16px}.col{display:flex;flex-direction:column;gap:14px}
.panel{background:#13263d;border-radius:18px;padding:18px 20px}
.paper{background:#fff;border-radius:16px;color:#12325e}
h1{font-size:34px;margin:0 0 6px}h2{font-size:26px;margin:0 0 10px}h3{font-size:21px;margin:0 0 8px;color:#f3b52f}
p,li{font-size:20px;line-height:1.45}p{margin:6px 0}ul,ol{margin:6px 0;padding-left:26px}
.muted{color:#9fb2c6}.small{font-size:16px}
.btn{border:0;border-radius:14px;padding:14px 26px;font-size:22px;font-weight:800;background:#0b5cad;color:#fff;min-height:62px;font-family:inherit}
.btn.y{background:#f3b52f;color:#1a1300}.btn.g{background:#22b866;color:#04220f}.btn.gh{background:#20395a;color:#eef3f8}.btn.r{background:#c62828}
.btn:disabled{opacity:.35}.btn.sm{font-size:17px;min-height:46px;padding:8px 16px;border-radius:11px}
.foot{position:absolute;left:20px;right:20px;bottom:16px;display:flex;align-items:center;gap:16px;min-height:66px}
.msg{flex:1;font-size:21px;font-weight:600;padding:12px 18px;border-radius:14px;background:#16304e}
.msg.ok{background:#14532d;color:#d9fbe6}.msg.bad{background:#5c1717;color:#ffe1e1}.msg.info{background:#16304e}
.pel{display:inline-block;background:#f3b52f;color:#1a1300;font-weight:800;font-size:17px;padding:5px 12px;border-radius:9px}
table.t{border-collapse:collapse;width:100%}table.t td,table.t th{border:2px solid #2c4766;padding:8px 10px;font-size:19px;text-align:left}table.t th{background:#16304e;color:#f3b52f}
input.tx{width:100%;font-size:24px;padding:12px 14px;border-radius:12px;border:3px solid #2c4766;background:#0a1828;color:#fff;font-family:inherit}input.tx:focus{border-color:#f3b52f;outline:none}
label.lb2{display:block;font-size:17px;color:#9fb2c6;margin:8px 0 4px}
/* kartu */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:#0f2238;border:4px solid #2c4766;border-radius:16px;padding:12px 8px;text-align:center;color:#eef3f8;font-family:inherit}
.card .e{font-size:50px;display:block;line-height:1.1}.card .n{font-size:17px;font-weight:700}
.card.sel{border-color:#f3b52f;background:#2a2a12}.card.ok{border-color:#22b866}.card.bad{border-color:#e04848;background:#3a1313}
.seq{display:flex;flex-direction:column;gap:8px}
.seq button{text-align:left;font-size:18px;font-weight:600;padding:10px 14px;border-radius:12px;border:3px solid #2c4766;background:#0f2238;color:#eef3f8;min-height:56px;font-family:inherit}
.seq button.used{opacity:.25}.seq .slot{display:flex;gap:10px;align-items:center}
.seq .slot b{width:40px;height:40px;border-radius:50%;background:#f3b52f;color:#1a1300;display:grid;place-items:center;font-size:20px;flex:none}
.seq .slot button{flex:1}.seq .slot button.empty{border-style:dashed;color:#56708c}.seq .slot button.bad{border-color:#e04848}.seq .slot button.ok{border-color:#22b866}
/* diagram */
svg.dg{display:block;width:100%;height:100%;color:#12325e}
svg.dg text{stroke:none;fill:#12325e;font-family:Arial,sans-serif}
svg.dg .lb{font-size:20px;font-weight:700}svg.dg .nm{font-size:12px;fill:#5d6878}svg.dg .pn{font-size:16px;font-weight:700;fill:#5d6878}
svg.dg .plus{font-size:32px;font-weight:700;fill:#7d93ab}svg.dg .lbs{font-size:15px;font-weight:700}svg.dg .red{fill:#c62828}
.port{fill:#f3b52f;stroke:#12325e;stroke-width:2.5}.port.sel{fill:#22b866;stroke-width:4}.port.used{fill:#12325e}
.hose{fill:none;stroke:#1f6fd0;stroke-width:5}.hose.bad{stroke:#e04848}.hose.p{stroke:#1f6fd0;stroke-width:6.5}.hose.np{stroke:#9bbbe0;stroke-dasharray:9 7;stroke-width:4}
.sol{fill:#fff}.sol.on{fill:#ffb020}.reed{fill:#dfe6ee}.reed.on{fill:#2ecc71}
.slot.cl line,.slot.cl path{stroke:#139a4c}.pth.on .w{stroke:#139a4c;stroke-width:5}.coil{fill:#fff}.coil.on{fill:#ffcf4a}
#vb{transition:transform .16s}
/* kontrol uji */
.ctrl{display:flex;align-items:center;gap:18px}
.tg{border:0;border-radius:16px;padding:10px 18px;min-width:180px;min-height:84px;background:#2b3a4d;color:#fff;font:800 20px/1.2 system-ui,Arial,sans-serif;font-family:inherit}
.tg small{display:block;font-size:15px;font-weight:600;opacity:.85}.tg.on{background:#1f8f55}
.s1{width:140px;height:140px;border-radius:50%;border:9px solid #cfd8dc;background:radial-gradient(circle at 40% 35%,#5bf09c,#14843f);color:#fff;font:900 28px/1.05 system-ui,Arial,sans-serif;font-family:inherit;touch-action:none;box-shadow:0 6px 0 #0b4d26}
.s1.down{transform:translateY(5px);box-shadow:0 1px 0 #0b4d26;filter:brightness(1.25)}
.leds{display:flex;gap:12px}.leds div{text-align:center;font:800 17px system-ui,Arial,sans-serif}.leds i{display:block;width:40px;height:40px;margin:0 auto 4px;border-radius:50%;background:#3a1a1a;border:3px solid #556}
.leds i.on{background:#ff4136;box-shadow:0 0 16px #ff4136}.leds i.g.on{background:#2ecc71;box-shadow:0 0 16px #2ecc71}
/* pengamatan */
table.ob{border-collapse:collapse;width:100%}table.ob td,table.ob th{border:2px solid #2c4766;padding:6px;font-size:18px;text-align:center}table.ob th{background:#16304e;color:#f3b52f;font-size:21px}
table.ob td.k{text-align:left;font-size:17px;width:330px}
.cell{width:74px;height:60px;border-radius:12px;border:3px solid #2c4766;background:#0f2238;color:#eef3f8;font:900 28px system-ui,Arial,sans-serif;font-family:inherit}
.cell.v1{background:#ffcf4a;color:#1a1300}.cell.bad{border-color:#e04848;border-width:5px}
/* modal */
#modal{position:absolute;inset:0;background:rgba(4,10,18,.72);display:none;align-items:center;justify-content:center;z-index:20}
#modal.show{display:flex}#mbox{background:#13263d;border:3px solid #f3b52f;border-radius:22px;padding:24px 28px;max-width:1240px;max-height:840px;overflow:auto;color:#eef3f8}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:12px 0}
.pal button{background:#fff;border:4px solid #2c4766;border-radius:14px;padding:6px;color:#12325e;font:700 15px system-ui,Arial,sans-serif;font-family:inherit;min-height:150px}
.pal button svg{width:118px;height:104px;display:block;margin:0 auto}.pal button.cur{border-color:#f3b52f}
.pad{display:grid;grid-template-columns:repeat(3,96px);gap:12px;justify-content:center;margin-top:14px}
.pad button{height:84px;border-radius:16px;border:0;background:#20395a;color:#fff;font:800 32px system-ui,Arial,sans-serif;font-family:inherit}
.pins{font:800 44px ui-monospace,monospace;letter-spacing:.4em;text-align:center;min-height:56px;color:#f3b52f}
#toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);background:#f3b52f;color:#1a1300;font-weight:800;font-size:22px;padding:14px 24px;border-radius:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:1100px;text-align:center}
#toast.show{opacity:1}
.sc{display:flex;gap:8px}.sc button{width:62px;height:56px;border-radius:12px;border:3px solid #2c4766;background:#0f2238;color:#fff;font:900 24px system-ui,Arial,sans-serif;font-family:inherit}.sc button.on{background:#f3b52f;color:#1a1300;border-color:#f3b52f}
.qcard{background:#0f2238;border-radius:16px;padding:14px 16px;margin-top:10px}
.kunci{background:#fff8e1;color:#4a3b00;border-radius:10px;padding:8px 12px;font-size:17px;margin-top:6px}
.chk{font-size:19px;margin:4px 0}.chk b.i{display:inline-block;width:30px}
.kode{font:900 38px ui-monospace,Consolas,monospace;background:#fff;color:#12325e;padding:12px 20px;border-radius:14px;letter-spacing:.05em;-webkit-user-select:all;user-select:all}
/* ---------- tampilan HP (otomatis: layar tegak / sempit) ---------- */
body.ph{overflow:auto;height:auto}
body.ph #stage{position:relative;width:100%;height:auto;min-height:100vh;transform:none!important;left:0!important;top:0!important;overflow:visible}
body.ph #top{height:auto;flex-wrap:wrap;padding:8px 10px;gap:8px}
body.ph #steps{order:5;flex-basis:100%;overflow-x:auto;justify-content:flex-start;padding-bottom:2px}
body.ph .st{font-size:13px;padding:5px 9px}body.ph .brand{flex:1}body.ph .brand b{font-size:16px}body.ph .brand span{font-size:12px}
body.ph #clock b{font-size:16px}body.ph #clock span{font-size:12px}body.ph .ib{width:44px;height:44px;font-size:20px;border-radius:11px}body.ph .mode{font-size:11px}
body.ph #main{position:static;padding:10px}
body.ph .row{flex-direction:column;height:auto!important}body.ph .row.keep{flex-direction:row}
body.ph .dgbox{width:100%!important;height:auto!important;flex:none!important}body.ph svg.dg{height:auto}
body.ph .panel{padding:12px 14px;border-radius:14px}
body.ph h1{font-size:23px}body.ph h2{font-size:19px}body.ph h3{font-size:17px}body.ph p,body.ph li{font-size:16px}body.ph .small{font-size:14px}
body.ph .btn{font-size:17px;min-height:50px;padding:10px 16px}body.ph .btn.sm{font-size:15px;min-height:44px}
body.ph .foot{position:sticky;bottom:0;left:auto;right:auto;margin-top:10px;background:#0E1C2E;padding:8px 0;gap:10px;z-index:5}
body.ph .msg{font-size:15px;padding:10px 12px}
body.ph .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}body.ph .card .e{font-size:36px}body.ph .card .n{font-size:14px}
body.ph .seq button{font-size:15px;min-height:48px;padding:8px 10px}body.ph .seq .slot b{width:32px;height:32px;font-size:16px}
body.ph table.t td,body.ph table.t th{font-size:15px;padding:6px 8px}
body.ph table.ob th{font-size:14px;padding:4px}body.ph table.ob td{padding:3px}body.ph table.ob td.k{width:auto;font-size:13px}body.ph .cell{width:40px;height:44px;font-size:20px;border-radius:9px}
body.ph .uctl{height:auto!important;position:sticky;bottom:0;z-index:5;padding:8px 10px;gap:10px;flex-wrap:wrap;margin-top:8px!important}
body.ph .tg{min-width:118px;min-height:54px;font-size:15px;padding:6px 10px}body.ph .tg small{font-size:12px}
body.ph .s1{width:92px;height:92px;font-size:20px;border-width:6px}body.ph .leds{gap:6px}body.ph .leds div{font-size:13px}body.ph .leds i{width:26px;height:26px}
body.ph .pal{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}body.ph .pal button{min-height:120px;font-size:13px}body.ph .pal button svg{width:96px;height:84px}
body.ph #modal{position:fixed}body.ph #mbox{width:94vw!important;max-height:88vh;padding:14px}
body.ph .pad{grid-template-columns:repeat(3,76px)}body.ph .pad button{height:64px;font-size:26px}
body.ph #toast{position:fixed;top:12px;font-size:16px;max-width:92vw}
body.ph .sc button{width:48px;height:46px;font-size:20px}body.ph .kode{font-size:26px}
body.ph #bFull{display:none}body.ph .nt{display:none}body.ph .uctl .pel{display:none}body.ph #ins{font-size:13px}body.ph .uctl p{font-size:15px}
body.ph input.tx{font-size:18px;padding:10px 12px}
@media print{#top,.foot,.noprint{display:none!important}#stage{position:static;transform:none!important;width:auto;height:auto;background:#fff;color:#000}#main{position:static}.panel{background:#fff;color:#000}table.t td,table.t th{border-color:#555;color:#000}table.t th{background:#eee}}
</style>
</head>
<body>
<div id="stage">
  <div id="top">
    <div class="brand"><b>JS-ASAS-SKEH-XII</b><span>Jobsheet virtual · TOI</span></div>
    <div id="steps"></div>
    <span id="modeBadge" class="mode"></span>
    <div id="clock"></div>
    <button class="ib" id="bGuru" title="Mode guru" aria-label="Mode guru">⚙</button>
    <button class="ib" id="bFull" title="Layar penuh" aria-label="Layar penuh">⛶</button>
  </div>
  <div id="main"></div>
  <div id="modal"><div id="mbox"></div></div>
  <div id="toast"></div>
</div>
<script>
'use strict';
/* ====================== data & penyimpanan ====================== */
const KEY='jsifp-skeh-asas-xii';
const LS={get(k,d){try{const v=localStorage.getItem(KEY+':'+k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(KEY+':'+k,JSON.stringify(v));}catch(e){}}};
function fnv(t){let h=0x811c9dc5;for(const c of String(t)){h^=c.charCodeAt(0);h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
const hp=v=>fnv('guruvokasi-skeh'+v).toString(36);
const DEF_SET={pinH:'iidn50',mode:'ujian',bobot:{k3:10,pn:20,el:25,uji:15,obs:15,lis:15}};
let SET=Object.assign({},DEF_SET,LS.get('set',{}));SET.bobot=Object.assign({},DEF_SET.bobot,SET.bobot||{});
if(SET.pin){if(SET.pin!=='2026')SET.pinH=hp(SET.pin);delete SET.pin;try{localStorage.setItem(KEY+':set',JSON.stringify(SET));}catch(e){}}
const saveSet=()=>LS.set('set',SET);
const ROLE=['Teknisi Pneumatik','Teknisi Listrik','Operator & Pencatat'];
const STG=[{id:'mulai',t:'Identitas'},{id:'k3',t:'K3',m:3},{id:'pn',t:'Pneumatik',m:4},{id:'el',t:'Listrik',m:8},{id:'uji',t:'Uji Fungsi',m:3},{id:'obs',t:'Pengamatan',m:3},{id:'lis',t:'Lisan'},{id:'rekap',t:'Rekap'}];
const ASPEK=[['k3','K3 & urutan kerja aman','K'],['pn','Rangkaian pneumatik','K'],['el','Rangkaian kontrol listrik (relai)','K'],['uji','Uji fungsi & prosedur nyala–matikan','K'],['obs','Lembar pengamatan','K']];
function baru(){return {stage:0,jenis:isPh()?'perorangan':'kelompok',ind:{nama:'',absen:'',kelas:'XII TOI'},grp:{nama:'',murid:['','',''],rot:0},t0:null,ts:{},res:{},
  k3:{apd:[],urut:[],triesA:0,triesB:0,doneA:false,doneB:false,badA:[],badB:[]},
  pn:{conns:[],tries:0,done:false,bad:[]},
  el:{p:[[null,null,null],[null,null,null],[null,null,null],[null,null,null]],tries:0,done:false,cek:null},
  uji:{first:null,orderBad:false,shutBad:false,cyc:0,done:false},
  obs:{t:[[null,null,null,null,null,null],[null,null,null,null,null,null],[null,null,null,null,null,null],[null,null,null,null,null,null],[null,null,null,null,null,null]],tries:0,done:false,bad:[]},
  lis:{q:null,sk:{}},hid:null};}
let S=LS.get('cur',null);if(!S||!S.k3)S=baru();if(!S.ind)S.ind={nama:'',absen:'',kelas:'XII TOI'};if(!S.jenis)S.jenis='kelompok';
const save=()=>LS.set('cur',S);
let GURU=false;

/* ====================== utilitas ====================== */
const $=s=>document.querySelector(s);
const MAIN=$('#main');
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),ms||2600);}
function modal(html,wide){const b=$('#mbox');b.innerHTML=html;b.style.width=wide?wide+'px':'';$('#modal').classList.add('show');return b;}
function closeModal(){$('#modal').classList.remove('show');$('#mbox').innerHTML='';}
function konfirmasi(judul,teks,ya,cb){const b=modal(`<h2>${judul}</h2><p>${teks}</p><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn gh" id="mN">Batal</button><button class="btn y" id="mY">${ya}</button></div>`,720);
  b.querySelector('#mN').onclick=closeModal;b.querySelector('#mY').onclick=()=>{closeModal();cb();};}
const mmss=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const now=()=>Date.now();
const skorTries=n=>Math.max(1,5-Math.max(1,n));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const latihan=()=>SET.mode==='latihan';
const PER=()=>S.jenis==='perorangan';
function murid(){if(PER()){const n=S.ind.nama.trim();return n?[n]:[];}return S.grp.murid.map(n=>n.trim()).filter(Boolean);}
function peranIdx(){const m=murid(),n=m.length;if(!n)return[];const r=S.grp.rot||0;return ROLE.map((_,i)=>(i+r)%n);}
function pelaksana(r){const m=murid();const p=peranIdx();return m.length?m[p[r]]:'-';}
function peranMurid(i){if(PER())return 'Perorangan';const p=peranIdx();return ROLE.filter((_,r)=>p[r]===i).join(' + ')||'-';}

/* ====================== skala layar & tombol atas ====================== */
function isPh(){return innerHeight>innerWidth||innerHeight<500||innerWidth<900;}
function layout(){const ph=isPh();document.body.classList.toggle('ph',ph);const st=$('#stage');if(ph){st.style.transform='';st.style.left='';st.style.top='';return;}const s=Math.min(innerWidth/1600,innerHeight/900);st.style.transform=`scale(${s})`;st.style.left=(innerWidth-1600*s)/2+'px';st.style.top=(innerHeight-900*s)/2+'px';}
addEventListener('resize',layout);layout();
$('#bFull').onclick=()=>{const d=document;if(d.fullscreenElement)d.exitFullscreen&&d.exitFullscreen();else{const e=d.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen||(()=>{})).call(e);}};
let wake=null;async function jagaLayar(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null);}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.t0)jagaLayar();});
addEventListener('beforeunload',e=>{if(S.t0&&S.stage<7){e.preventDefault();e.returnValue='';}});

function topBar(){const st=$('#steps');st.innerHTML=STG.map((g,i)=>!aktif(i)?'':`<span class="st ${i===S.stage?'cur':i<S.stage?'done':''}">${i<S.stage?'✓ ':''}${g.t}</span>`).join('');
  const mb=$('#modeBadge');mb.textContent=latihan()?'MODE LATIHAN':'MODE UJIAN';mb.className='mode'+(latihan()?' lat':'');
  $('#bGuru').className='ib'+(GURU?' on':'');$('#bGuru').textContent=GURU?'🔓':'⚙';tick();}
function tick(){const c=$('#clock');if(!S.t0){c.innerHTML='<b>--:--</b><span>belum mulai</span>';return;}
  const g=STG[S.stage],ts=S.ts[g.id];const tot=((S.ts.rekap&&S.ts.rekap.a)||now())-S.t0;
  let sub='';if(g.m&&ts){const d=((ts.b||now())-ts.a)/1000;sub=`<span class="${d>g.m*60?'late':''}">tahap ${mmss(d)} / ${String(g.m).padStart(2,'0')}:00</span>`;}
  c.innerHTML=`<b>⏱ ${mmss(tot/1000)}</b>${sub||'<span>waktu total</span>'}`;}

function go(i){const cur=STG[S.stage].id;if(S.ts[cur]&&!S.ts[cur].b)S.ts[cur].b=now();S.stage=i;const nx=STG[i].id;if(!S.ts[nx])S.ts[nx]={a:now()};else if(S.ts[nx].b&&i<7)delete S.ts[nx].b;save();render();}

const CT={S1:{n:'S1',t:'Tombol S1 (NO)',num:['13','14'],act:'push'},a0:{n:'a0',t:'Reed switch a0',act:'reed'},a1:{n:'a1',t:'Reed switch a1',act:'reed'},

/* ====================== mesin simulasi ====================== */
function cl(t,st){switch(t){case'S1':return st.S1;case'a0':return st.x<=0.02;case'a1':return st.x>=0.98;case'K1o':return st.R.K1;case'K1c':return!st.R.K1;case'K2o':return st.R.K2;case'K2c':return!st.R.K2;case'J':return true;}return false;}
function solve(st,P){let cond=[];for(let it=0;it<8;it++){cond=P.map(p=>!!(st.v24&&p[2]&&cl(p[0],st)&&cl(p[1],st)));const o={K1:false,K2:false,Y1:false,Y2:false};P.forEach((p,i)=>{if(cond[i])o[p[2]]=true;});
  const ch=o.K1!==st.R.K1||o.K2!==st.R.K2;st.R.K1=o.K1;st.R.K2=o.K2;st.Y1=o.Y1;st.Y2=o.Y2;if(!ch)break;}st.cond=cond;}
function step(st,P,dt){solve(st,P);if(st.Y1&&!st.Y2)st.vpos='a';else if(st.Y2&&!st.Y1)st.vpos='b';if(st.air){if(st.vpos==='a')st.x=Math.min(1,st.x+dt/1.2);else st.x=Math.max(0,st.x-dt/1.0);}}
const simBaru=(air,v24)=>({x:0,vpos:'b',air:!!air,v24:!!v24,S1:false,R:{K1:false,K2:false},Y1:false,Y2:false,cond:[]});
function ujiPerilaku(P){const st=simBaru(true,true),dt=0.02;let maju=0;
  const run=(t,f)=>{const n=Math.round(t/dt);for(let i=0;i<n;i++){const pv=st.vpos;step(st,P,dt);if(pv!=='a'&&st.vpos==='a')maju++;if(f&&f())return true;}return false;};
  run(1);if(maju>0||st.x>0.01)return 'Silinder sudah bergerak maju sebelum S1 ditekan.';
  st.S1=true;run(0.3);st.S1=false;let mx=0;run(5,()=>{mx=Math.max(mx,st.x);});
  if(maju===0)return 'Saat S1 ditekan, solenoid Y1 tidak aktif sehingga silinder tidak maju.';
  if(mx<0.98)return 'Silinder tidak maju sampai a1.';
  if(maju>1)return 'Silinder maju berulang setelah S1 dilepas, padahal seharusnya hanya satu siklus.';
  if(st.x>0.02)return 'Setelah sampai a1, silinder tidak mundur kembali ke a0.';
  st.S1=true;run(0.3);st.S1=false;run(3,()=>st.x>=0.98);run(3,()=>st.vpos==='b'&&st.x<0.6);
  if(!(st.vpos==='b'&&st.x<0.6&&st.x>0.05))return 'Siklus kedua tidak berjalan normal.';
  const m0=maju;st.S1=true;run(0.2);st.S1=false;run(3);
  if(maju>m0||st.x>0.02)return 'S1 masih bisa memajukan silinder walaupun silinder belum kembali di posisi awal (a0).';
  return null;}
function cekLadder(P){const coils=P.map(p=>p[2]).filter(Boolean);
  const c1=['K1','K2','Y1','Y2'].every(k=>coils.filter(x=>x===k).length===1);
  const c2=['Y1','Y2'].every(y=>{const p=P.find(q=>q[2]===y);if(!p)return false;const cs=[p[0],p[1]];return cs.every(t=>t&&(t==='J'||t[0]==='K'))&&cs.some(t=>t==='K1o'||t==='K2o');});
  const p1=P.find(q=>q[2]==='Y1'),p2=P.find(q=>q[2]==='Y2');const no=p=>[p[0],p[1]].filter(t=>t==='K1o'||t==='K2o').map(t=>t.slice(0,2)),nc=p=>[p[0],p[1]].filter(t=>t==='K1c'||t==='K2c').map(t=>t.slice(0,2));
  const c3=!!(p1&&p2&&no(p2).some(r=>nc(p1).includes(r))&&no(p1).some(r=>nc(p2).includes(r)));
  const why=c1?ujiPerilaku(P):'Koil belum lengkap.';
  return [{ok:c1,t:'Koil K1, K2, Y1, dan Y2 masing-masing terpasang satu kali.'},{ok:c2,t:'Solenoid Y1/Y2 digerakkan lewat kontak relai K1/K2, bukan langsung dari S1 atau reed switch.'},{ok:c3,t:'Ada interlock: kontak NC relai lawan di jalur Y1 dan di jalur Y2.'},{ok:!why,t:'Fungsi: S1 (saat di a0) → maju → a1 → mundur otomatis → berhenti di a0, satu siklus.',why}];}
function obsKunci(P){const st=simBaru(true,true);const snap=()=>{solve(st,P);return [st.x<=0.02,st.x>=0.98,st.R.K1,st.R.K2,st.Y1,st.Y2].map(b=>b?1:0);};
  const r=[snap()];st.S1=true;r.push(snap());st.S1=false;st.vpos='a';st.x=0.5;r.push(snap());st.x=1;r.push(snap());st.vpos='b';st.x=0.5;r.push(snap());return r;}

let SIM=null,RAF=0,LAST=0,ONTICK=null;

  if(!SIM)return;const pv=SIM.x;step(SIM,S.el.p,dt*(SIM.slow||1));if(ONTICK)ONTICK(pv);draw();};RAF=requestAnimationFrame(f);}
function stopLoop(){cancelAnimationFrame(RAF);RAF=0;ONTICK=null;}
function draw(){const st=SIM;if(!st)return;const q=id=>document.getElementById(id);
  const pis=q('pis');if(pis)pis.setAttribute('transform',`translate(${(315+270*st.x).toFixed(1)},0)`);
  const vb=q('vb');if(vb)vb.style.transform=st.vpos==='a'?'translateX(90px)':'';
  const tg=(id,c,on)=>{const e=q(id);if(e)e.classList.toggle(c,!!on);};
  tg('sY1','on',st.Y1);tg('sY2','on',st.Y2);tg('ra0','on',st.x<=0.02);tg('ra1','on',st.x>=0.98);

const predikat=n=>n>=90?'SB':n>=70?'B':n>=50?'C':'PB';
function nilaiVirtual(sk){const B=SET.bobot,sb=ASPEK.reduce((a,[k])=>a+B[k],0)||1;return Math.round(ASPEK.reduce((a,[k])=>a+(sk[k]||1)*B[k],0)/(4*sb)*1000)/10;}
const skorNow=()=>Object.fromEntries(ASPEK.map(([k])=>[k,(S.res[k]&&S.res[k].skor)||1]));
function hitung(){const B=SET.bobot,ms=murid();const sk=k=>(S.res[k]&&S.res[k].skor)||1;
  if(PER()){const nilai=nilaiVirtual(skorNow());return ms.map(n=>({nama:n,absen:S.ind.absen,peran:'Perorangan',lis:null,nilai,pred:predikat(nilai),tuntas:nilai>=70}));}
  const kel=ASPEK.reduce((a,[k])=>a+sk(k)*B[k],0);
  return ms.map((n,i)=>{const l=[S.lis.sk[i+'-0'],S.lis.sk[i+'-1']].filter(Boolean);const lis=l.length?l.reduce((a,b)=>a+b,0)/l.length:1;
    const nilai=Math.round((kel+lis*B.lis)/4*10)/10;return {nama:n,peran:peranMurid(i),lis,nilai,pred:predikat(nilai),tuntas:nilai>=70};});}
const durasiMenit=()=>Math.round((((S.ts.rekap&&S.ts.rekap.a)||now())-(S.t0||now()))/6000)/10;
/* kode hasil: absen(2) + skor 5 aspek + menit(2) + tanda(1) + cek(4) */
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function cekKode(p){let h=fnv('TOI-SKEH-ASAS-XII|'+p),c='';for(let i=0;i<4;i++){c+=B32[h%32];h=Math.floor(h/32);}return c;}
function tandaHasil(){let f=0;ASPEK.forEach(([k])=>{const n=(S.res[k]&&S.res[k].note)||'';if(n.includes('kunci'))f|=1;if(n.includes('diubah guru'))f|=2;});return f;}
function kodeHasil(){const p=String(Math.min(99,+S.ind.absen||0)).padStart(2,'0')+ASPEK.map(([k])=>(S.res[k]&&S.res[k].skor)||1).join('')+String(Math.min(99,Math.round(durasiMenit()))).padStart(2,'0')+tandaHasil();return p+cekKode(p);}
const fmtKode=k=>`${k.slice(0,2)}-${k.slice(2,7)}-${k.slice(7,10)}-${k.slice(10)}`;
function bacaKode(t){const k=String(t).toUpperCase().replace(/[^0-9A-Z]/g,'');if(k.length!==14||!/^\d{10}$/.test(k.slice(0,10)))return null;const p=k.slice(0,10);if(cekKode(p)!==k.slice(10))return null;
  const sk={};ASPEK.forEach(([a],i)=>sk[a]=+p[2+i]);if(Object.values(sk).some(v=>v<1||v>4))return null;return {kode:k,absen:+p.slice(0,2),sk,menit:+p.slice(7,9),tanda:+p[9]};}

function isiKunci(id){const sk=(k,n)=>setRes(k,1,n||'diisi kunci oleh guru');
  if(id==='k3'){Object.assign(S.k3,{apd:APD.filter(a=>a.w===1).map(a=>a.id),urut:URUT.map((_,i)=>i),doneA:true,doneB:true,badA:[],badB:[]});sk('k3');}

  else if(id==='obs'){Object.assign(S.obs,{t:obsKunci(S.el.p),done:true,bad:[]});sk('obs');}
  save();}
function panelGuru(info){const H=LS.get('hist',[]),B=SET.bobot,sum=Object.values(B).reduce((a,b)=>a+(+b||0),0),cur=STG[S.stage].id;
  const b=modal(`<div class="row" style="justify-content:space-between;align-items:center"><h1>⚙ Mode guru</h1><div class="row"><button class="btn r sm" id="gLock">🔒 Kunci & tutup</button><button class="btn gh sm" id="gX">Tutup</button></div></div>
  <div class="row" style="align-items:flex-start;margin-top:10px">
   <div class="col" style="flex:1">
    <div class="panel"><h3>Mode pengerjaan</h3><div class="row"><button class="btn ${SET.mode==='ujian'?'y':'gh'} sm" data-m="ujian">Ujian — tanpa petunjuk letak salah</button><button class="btn ${SET.mode==='latihan'?'y':'gh'} sm" data-m="latihan">Latihan — salah ditandai</button></div></div>
    <div class="panel"><h3>Kelompok sekarang: ${esc(S.grp.nama||'-')} · tahap ${STG[S.stage].t}</h3>
     <p class="small muted">Lompat ke tahap:</p><div class="row" style="flex-wrap:wrap;gap:8px">${STG.map((g,i)=>`<button class="btn gh sm" data-j="${i}">${g.t}</button>`).join('')}</div>
     ${['k3','pn','el','uji','obs'].includes(cur)?`<p class="small muted" style="margin-top:12px">Kelompok buntu? Isi kunci tahap ini (skor tahap = 1) agar bisa lanjut ke trainer.</p><button class="btn gh sm" id="gKunci">🗝 Isi kunci tahap ${STG[S.stage].t}</button>`:''}
     <div style="margin-top:12px"><button class="btn r sm" id="gReset">Ulang kelompok ini dari awal</button></div></div>
    <div class="panel"><h3>Bobot penilaian (jumlah harus 100 · sekarang <span style="color:${sum===100?'#7ef0ac':'#ff9a8a'}">${sum}</span>)</h3>
     <div class="row" style="flex-wrap:wrap;gap:10px">${[['k3','K3'],['pn','Pneumatik'],['el','Listrik'],['uji','Uji fungsi'],['obs','Pengamatan'],['lis','Lisan']].map(([k,n])=>`<div style="width:150px"><label class="lb2">${n}</label><div class="row" style="gap:6px;align-items:center"><button class="btn gh sm" data-bm="${k}">−</button><b style="font-size:24px;width:40px;text-align:center">${B[k]}</b><button class="btn gh sm" data-bp="${k}">+</button></div></div>`).join('')}</div></div>
    <div class="panel"><h3>Ganti PIN guru</h3><div class="row"><input class="tx" id="gPin" inputmode="numeric" maxlength="8" placeholder="PIN baru (4–8 angka)" style="flex:1"><button class="btn gh sm" id="gPinS">Simpan</button></div></div>
   </div>
   <div class="col" style="flex:1"><div class="panel"><h3>Cek kode hasil murid (perorangan)</h3>
     <div class="row" style="gap:8px"><input class="tx" id="cN" maxlength="40" placeholder="Nama murid" style="flex:1.3"><input class="tx" id="cK" maxlength="20" placeholder="Kode hasil" style="flex:1;text-transform:uppercase"></div>
     <div class="row" style="margin-top:8px;align-items:center"><button class="btn y sm" id="cCek">Cek & simpan</button><span id="cOut" class="small">${info||'Ketik nama + kode dari layar/tangkapan layar murid.'}</span></div></div>
   <div class="panel col"><h3>Riwayat di perangkat ini (${H.length} entri)</h3>
    <div style="max-height:470px;overflow:auto"><table class="t">${H.length?`<tr><th>Kelompok</th><th>Murid · nilai</th></tr>`+H.slice().reverse().map(h=>`<tr><td><b>${esc(h.kelompok)}</b><div class="small muted">${esc(h.tgl)} · ${h.mode}</div></td><td class="small">${h.murid.map(m=>`${esc(m.nama)}: <b>${String(m.nilai).replace('.',',')}</b> (${m.pred})`).join('<br>')}</td></tr>`).join(''):'<tr><td class="muted">Belum ada data.</td></tr>'}</table></div>
    <div class="row" style="margin-top:12px"><button class="btn y sm" id="gCsv">⬇ Unduh CSV</button><button class="btn r sm" id="gDel">Hapus riwayat</button></div></div></div>
  </div>`,1240);
  b.querySelector('#gX').onclick=closeModal;b.querySelector('#gLock').onclick=()=>{GURU=false;closeModal();render();};
  b.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{SET.mode=x.dataset.m;saveSet();topBar();panelGuru();});
  b.querySelectorAll('[data-j]').forEach(x=>x.onclick=()=>{closeModal();if(!S.t0)S.t0=now();go(+x.dataset.j);});
  b.querySelectorAll('[data-bm],[data-bp]').forEach(x=>x.onclick=()=>{const k=x.dataset.bm||x.dataset.bp;B[k]=Math.max(0,Math.min(100,B[k]+(x.dataset.bm?-5:5)));saveSet();panelGuru();});
  const gk=b.querySelector('#gKunci');if(gk)gk.onclick=()=>konfirmasi('Isi kunci?',`Tahap ${STG[S.stage].t} akan diisi jawaban benar dan skornya menjadi 1.`,'Isi kunci',()=>{isiKunci(cur);render();});
  b.querySelector('#gReset').onclick=()=>konfirmasi('Ulang kelompok ini?','Semua pekerjaan kelompok yang sedang berjalan dihapus (riwayat yang sudah tersimpan tetap ada).','Ulang',()=>{S=baru();save();URUT_ACAK=null;SELP=null;render();});
  b.querySelector('#gPinS').onclick=()=>{const v=b.querySelector('#gPin').value.trim();if(!/^\d{4,8}$/.test(v))return toast('PIN harus 4–8 angka.');SET.pinH=hp(v);saveSet();toast('PIN baru tersimpan di perangkat ini.');};
  b.querySelector('#gCsv').onclick=unduhCSV;
  b.querySelector('#cCek').onclick=()=>{const nama=b.querySelector('#cN').value.trim(),d=bacaKode(b.querySelector('#cK').value),out=b.querySelector('#cOut');
    if(!nama){out.innerHTML='<b style="color:#ff9a8a">Isi nama murid.</b>';return;}
    if(!d){out.innerHTML='<b style="color:#ff9a8a">❌ Kode tidak valid.</b> Periksa lagi huruf/angkanya.';return;}
    const H2=LS.get('hist',[]);const nilai=nilaiVirtual(d.sk),pr=predikat(nilai);
    const tanda=(d.tanda&1?' · ⚠ dibantu kunci guru':'')+(d.tanda&2?' · skor diubah guru':'');
    if(H2.some(h=>h.kode===d.kode)){out.innerHTML=`<b style="color:#f3b52f">Kode ini sudah tercatat.</b>`;return;}
    H2.push({id:'k'+now(),tgl:new Date().toLocaleString('id-ID'),kelompok:'Perorangan (kode)',mode:'kode',skor:d.sk,menit:d.menit,kode:d.kode,murid:[{nama,absen:d.absen,peran:'Perorangan',lis:null,nilai,pred:pr,tuntas:nilai>=70}]});LS.set('hist',H2);
    panelGuru(`<b style="color:#7ef0ac">✅ ${esc(nama)} (absen ${d.absen}) · skor ${ASPEK.map(([k])=>d.sk[k]).join('/')} · ${d.menit} mnt · nilai ${String(nilai).replace('.',',')} (${pr})</b>${tanda} — tersimpan.`);};
  b.querySelector('#gDel').onclick=()=>konfirmasi('Hapus semua riwayat?','Unduh CSV dulu bila datanya masih diperlukan. Tindakan ini tidak bisa dibatalkan.','Hapus',()=>{LS.set('hist',[]);toast('Riwayat dihapus.');});}

/* ====================== render ====================== */
function render(){stopLoop();closeModal();topBar();const id=STG[S.stage].id;if(id!=='obs'&&SIM)SIM.keep=0;if(id!=='pn')SELP=null;
  if(S.stage>0&&!S.t0){S.stage=0;}
  if(!S.ts[id]&&S.t0)S.ts[id]={a:now()};R[id]();}
render();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{}));}
</script>
</body>
</html>
